<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangular Animation</title>
    <style>
        body {
            background: linear-gradient(45deg, #4d1616, #3b3b6c);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center {
            position: relative;
            width: 250px;
            height: 250px;
            background-color: blue;
            box-shadow: 0px 0px 50px 3px #000;
        }

        span {
            position: absolute;
            box-shadow: 0px 0px 25px #000;
            animation: ani 3s ease-in-out infinite;
        }
        span:nth-child(1) { width: 220px; height: 220px; background-color: green; left: 6%; top: 6%; animation-delay: 0.4s; }
        span:nth-child(2) { width: 200px; height: 200px; background-color: rgb(158, 179, 158); left: 10%; top: 10%; animation-delay: 0.4s; }
        span:nth-child(3) { width: 180px; height: 180px; background-color: rgb(0, 107, 128); left: 14%; top: 14%; animation-delay: 0.5s; }
        span:nth-child(4) { width: 160px; height: 160px; background-color: rgb(130, 14, 156); left: 18%; top: 18%; animation-delay: 0.6s; }
        span:nth-child(5) { width: 140px; height: 140px; background-color: rgb(20, 98, 154); left: 22%; top: 22%; animation-delay: 0.7s; }
        span:nth-child(6) { width: 120px; height: 120px; background-color: rgb(172, 18, 18); left: 26%; top: 26%; animation-delay: 0.8s; }
        span:nth-child(7) { width: 100px; height: 100px; background-color: rgb(167, 42, 73); left: 30%; top: 30%; animation-delay: 1s; }
        span:nth-child(8) { width: 80px; height: 80px; background-color: rgb(62, 186, 85); left: 34%; top: 34%; animation-delay: 1.2s; }
        span:nth-child(9) { width: 60px; height: 60px; background-color: rgb(185, 208, 40); left: 38%; top: 38%; animation-delay: 1.4s; }
        span:nth-child(10) { width: 40px; height: 40px; background-color: rgba(200, 0, 255, 0.607); left: 42%; top: 42%; animation-delay: 1.6s; }
        span:nth-child(11) { width: 20px; height: 20px; background-color: rgb(51, 16, 193); left: 46%; top: 46%; animation-delay: 1.8s; }
        span:nth-child(12) { width: 10px; height: 10px; background-color: rgb(245, 84, 4); left: 48%; top: 48%; animation-delay: 2s; }

        @keyframes ani {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(95deg); }
            50% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>
    <div class="center">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>
</body>
</html>
